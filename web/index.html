<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ttm" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Paint the saved theme's background before the app script runs, so a light theme doesn't flash dark.
      try {
        var bg = localStorage.getItem('ttm.theme.bg');
        if (bg) {
          document.documentElement.style.background = bg;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
        }
      } catch (e) {}
    </script>
    <title>ttm</title>
  </head>
  <body>
    <div id="edge" aria-hidden="true"></div>
    <div id="login" hidden>
      <form id="login-form">
        <h1>ttm</h1>
        <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required />
        <button type="submit">Sign in</button>
        <p id="login-err" role="alert"></p>
      </form>
    </div>
    <div id="offline" hidden role="status">
      <div>
        <h1>Can't reach ttm</h1>
        <p>The server isn't answering. Trying again…</p>
        <button type="button" id="offline-retry">Retry now</button>
      </div>
    </div>
    <div id="app" hidden>
      <aside id="left"></aside>
      <div id="main">
        <button type="button" id="usage" aria-label="Plan usage: tap for details">usage…</button>
        <div id="panes"></div>
      </div>
      <aside id="right"></aside>
      <div id="scrim"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
