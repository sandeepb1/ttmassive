# Builds ttm for each platform when a v* tag is pushed (see `make publish`) and publishes a
# GitHub Release. Running servers find it and offer to install it.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          # Older glibc than ubuntu-latest, so the binary runs on more distributions.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag matches Cargo.toml
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" = "${GITHUB_REF_NAME}"
      - run: cd web && npm ci && npm run build
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          name="ttm-${GITHUB_REF_NAME}-${{ matrix.target }}"
          tar -czf "$name.tar.gz" -C "target/${{ matrix.target }}/release" ttm
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ttm-*

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Release notes and title
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range=${prev:+$prev..}${GITHUB_REF_NAME}
          # Commits go straight to main, so list those rather than pull requests.
          git log "$range" --format='- %s' --invert-grep --grep='^Release v' > notes.md
          [ -s notes.md ] || echo "- Maintenance release" > notes.md
          echo "TITLE=${GITHUB_REF_NAME} — $(git tag -l --format='%(contents:subject)' "${GITHUB_REF_NAME}")" >> "$GITHUB_ENV"
      - name: Publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$TITLE" --notes-file notes.md
